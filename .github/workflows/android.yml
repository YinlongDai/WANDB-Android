name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The release key comes from repository secrets; it never lives in the repo.
      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Name release APK
        run: cp app/build/outputs/apk/release/app-release.apk "runwatch-0.2.${{ github.run_number }}.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: runwatch-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            runwatch-0.2.${{ github.run_number }}.apk

      # Each push to main becomes a GitHub Release; the app's updater installs the latest one.
      # Only when signed with the release key, so every published APK can update the previous one.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: RunWatch 0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          # Manual runs have no head commit; fall back to the generated notes.
          body: ${{ github.event.head_commit.message }}
          generate_release_notes: ${{ github.event_name != 'push' }}
          make_latest: "true"
          files: runwatch-0.2.${{ github.run_number }}.apk
